<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peça seu Sistema - 9901</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
            max-width: 450px;
            margin: auto;
        }
        h1 {
            color: #2b7a78;
            text-align: center;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #3aafa9;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2b7a78;
        }
    </style>
</head>
<body>

    <h1>9901</h1>
    <p style="text-align: center;">Solicite o desenvolvimento do seu sistema personalizado.</p>

    <form>
        <label for="nome">Seu Nome ou Empresa:</label>
        <input type="text" id="nome" name="nome" placeholder="Nome do cliente">

        <label for="email">E-mail de Contato:</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com">

        <label for="tipo-sistema">Tipo de Sistema:</label>
        <select id="tipo-sistema" name="tipo_sistema">
            <option value="web">Sistema Web (Acessado pelo navegador)</option>
            <option value="app">Aplicativo para Celular</option>
            <option value="automacao">Automação de Tarefas</option>
            <option value="outro">Outro</option>
        </select>

        <label for="descricao">O que o sistema precisa fazer?</label>
        <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva as funções principais do programa..."></textarea>

        <button type="submit">Enviar Pedido de Sistema</button>
    </form>

</body>
</html>
